[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kevin"
version = "0.1.0"
description = "SEC 8-K earnings intelligence engine for hedge funds"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.7",
    "anthropic>=0.28",   # optional — only used when KEVIN_LLM=anthropic
    "textual>=0.61.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx[test]"]

[project.scripts]
kevin = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kevin*"]
